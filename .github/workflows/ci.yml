name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOFLAGS: "-mod=readonly"
      CANDACE_CRON_TEST_DATABASE_URL: "postgresql://cron:cron@127.0.0.1:5432/candace_cron_test?sslmode=disable"

    services:
      postgres:
        image: postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_USER: cron
          POSTGRES_PASSWORD: cron
          POSTGRES_DB: candace_cron_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cron -d candace_cron_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go 1.26.5
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            printf 'Unformatted Go files:\n%s\n' "${unformatted}" >&2
            exit 1
          fi

      - name: Enforce Ginkgo behavior tests
        run: ./scripts/check-test-style.sh

      - name: Vet the complete module
        run: go vet ./...

      - name: Run race tests with PostgreSQL integration
        run: go test -race ./...

      - name: Verify generated Gomock store
        run: |
          expected_mock="$(mktemp)"
          cp cron/mock_store_test.go "${expected_mock}"
          go generate ./cron
          diff -u "${expected_mock}" cron/mock_store_test.go

      - name: Verify generated Liquid Proto bindings
        run: ./proto/generate.sh check

      - name: Verify generated SQLC bindings
        run: ./cron/postgres/generate.sh check
